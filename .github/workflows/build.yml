name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: write # needed to create GitHub releases

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Prepare libobs
        shell: pwsh
        run: ./scripts/setup-libobs.ps1

      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build

      - name: Version
        id: ver
        shell: pwsh
        run: |
          if ($env:GITHUB_REF -like 'refs/tags/v*') { $v = $env:GITHUB_REF_NAME.TrimStart('v') } else { $v = "0.0.0-dev" }
          "version=$v" >> $env:GITHUB_OUTPUT

      - name: Installer
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DAppVersion=${{ steps.ver.outputs.version }}" "/DBuildDir=..\build" installer\w_vst3.iss

      - uses: actions/upload-artifact@v4
        with:
          name: w_vst3-windows-x64
          path: |
            build/w_vst3.dll
            build/w_vst3_scanner.exe
            dist/*.exe

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: w_vst3 ${{ steps.ver.outputs.version }}
          files: dist/*.exe
          body: |
            OBS Studio plugin that hosts one VST3 effect as an audio filter.

            **Install:** quit OBS, run the setup exe. (Korean and English installer.)
            Tested with OBS Studio 33.0.1 on Windows 64-bit.

            **Known limitations**
            - Plugin latency is not compensated (for example RX De-click is about 0.7 s).
            - Only the first two channels (mono/stereo) are processed.
            - Plugins run inside the OBS process; a plugin crash can crash OBS.
            - The installer is unsigned, so Windows SmartScreen may warn.

            See the [English](docs/USAGE.md) and [한국어](docs/USAGE.ko.md) user guides.
